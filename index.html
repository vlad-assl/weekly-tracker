<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Vladan Neziri">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Week">
<meta name="theme-color" content="#0A2C1D">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230A2C1D'/><circle cx='32' cy='32' r='15' fill='%23F2C300'/></svg>">
<title>My Week</title>
<style>
  :root{
    --pitch:#0A2C1D;
    --pitch-raised:#10391F;
    --chalk:#E8F3EC;
    --chalk-dim:#8FAE9C;
    --line:rgba(232,243,236,.16);
    --amber:#F2C300;
    --lime:#9BE564;
    --tap:.08s;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--pitch);color:var(--chalk)}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:17px;line-height:1.35;
    padding:env(safe-area-inset-top) 0 calc(28px + env(safe-area-inset-bottom));
    background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.014) 0 56px,transparent 56px 112px);
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 18px}

  /* scoreboard */
  .board{margin-top:18px;border:1.5px solid var(--line);border-radius:6px;background:var(--pitch-raised);padding:16px 16px 14px}
  .board-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .who{font-size:15px;letter-spacing:.14em;color:var(--chalk-dim)}
  .dates{font-size:13px;color:var(--chalk-dim);font-variant-numeric:tabular-nums}
  .score{display:flex;align-items:baseline;gap:8px;margin:8px 0 12px}
  .score b{
    font-size:54px;line-height:.9;font-weight:800;color:var(--amber);
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  }
  .score span{font-size:17px;color:var(--chalk-dim);font-variant-numeric:tabular-nums}
  .bar{display:flex;gap:4px;height:16px}
  .bar i{flex:1;background:rgba(232,243,236,.09);border-radius:2px;transition:background var(--tap) linear}
  .bar i.on{background:var(--amber)}
  .bar i.full{background:var(--lime)}
  .fulltime{
    margin-top:12px;padding:10px;border:1.5px solid var(--lime);border-radius:4px;
    color:var(--lime);font-weight:700;text-align:center;font-size:15px;letter-spacing:.06em;
  }

  /* days */
  .days{display:flex;gap:6px;margin:18px 0 4px}
  .day{
    flex:1;padding:9px 0 8px;border:1.5px solid var(--line);border-radius:5px;background:transparent;
    color:var(--chalk-dim);font:inherit;font-size:14px;font-weight:700;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:5px;
  }
  .day .dot{width:5px;height:5px;border-radius:50%;background:transparent}
  .day .dot.train{background:var(--chalk-dim)}
  .day .dot.done{background:var(--lime)}
  .day[aria-pressed="true"]{border-color:var(--chalk);color:var(--chalk);background:var(--pitch-raised)}
  .plan{margin:14px 0 24px;color:var(--chalk-dim);font-size:15px}
  .plan strong{color:var(--chalk);font-weight:600}

  /* task groups */
  h2{
    margin:26px 0 2px;font-size:15px;font-weight:700;letter-spacing:.02em;
    display:flex;justify-content:space-between;align-items:baseline;
  }
  h2 em{font-style:normal;font-size:13px;color:var(--chalk-dim);font-variant-numeric:tabular-nums}
  .task{
    width:100%;display:flex;align-items:center;gap:14px;padding:15px 2px;
    background:none;border:0;border-bottom:1px solid var(--line);
    color:var(--chalk);font:inherit;text-align:left;cursor:pointer;
  }
  .tick{
    flex:none;width:26px;height:26px;border:2px solid var(--chalk-dim);border-radius:50%;
    display:grid;place-items:center;transition:transform var(--tap) ease-out;
  }
  .tick svg{width:15px;height:15px;stroke:var(--pitch);stroke-width:3.2;fill:none;opacity:0}
  .task[aria-pressed="true"] .tick{background:var(--lime);border-color:var(--lime)}
  .task[aria-pressed="true"] .tick svg{opacity:1}
  .task[aria-pressed="true"] .label{color:var(--chalk-dim);text-decoration:line-through;text-decoration-color:var(--chalk-dim)}
  .task:active .tick{transform:scale(.86)}
  .label{flex:1}
  .pts{flex:none;color:var(--chalk-dim);font-size:14px;font-variant-numeric:tabular-nums}

  /* water */
  .water{display:flex;align-items:center;gap:14px;padding:15px 2px;border-bottom:1px solid var(--line)}
  .glasses{display:flex;gap:7px;margin-left:auto}
  .glass{
    width:22px;height:30px;border:2px solid var(--chalk-dim);border-radius:3px 3px 7px 7px;
    background:none;cursor:pointer;padding:0;
  }
  .glass.on{background:var(--amber);border-color:var(--amber)}

  footer{margin-top:34px;color:var(--chalk-dim);font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .reset{background:none;border:0;color:var(--chalk-dim);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px 0}
  :focus-visible{outline:2px solid var(--amber);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <section class="board">
    <div class="board-top">
      <div class="who" id="who">VEDRAN · SAS FUTBOL</div>
      <div class="dates" id="dates"></div>
    </div>
    <div class="score"><b id="pts">0</b><span id="target"></span></div>
    <div class="bar" id="bar"></div>
    <div class="fulltime" id="fulltime" hidden>Full time. Week smashed.</div>
  </section>

  <nav class="days" id="days" aria-label="Day of the week"></nav>
  <p class="plan" id="plan"></p>

  <div id="lists"></div>

  <footer>
    <span id="weekly"></span>
    <button class="reset" id="reset">Clear this day</button>
  </footer>
</div>

<script>
/* ---------------------------------------------------------------
   CONFIG — edit these lists to change what Vedran sees.
   Days run Mon(0) ... Sun(6). pts = points per task.
   --------------------------------------------------------------- */
const PLAYER = "VEDRAN · SAS FUTBOL";

const PLAN = [
  { day:"Mon", train:true,  note:"Session tonight. Nothing extra at home." },
  { day:"Tue", train:false, note:"Free night. Best day for ball work." },
  { day:"Wed", train:false, note:"Free night. Get the legs moving." },
  { day:"Thu", train:false, note:"Free night. Touch and control." },
  { day:"Fri", train:true,  note:"Session tonight. Recover well after." },
  { day:"Sat", train:false, note:"Get to the park. Play, don't drill." },
  { day:"Sun", train:false, note:"Off-season Sunday. Play for fun, then set next week up." }
];

const BALL = [
  [ {id:"b1",label:"Arrive early, 20 touches before warm-up",pts:5} ],
  [ {id:"b1",label:"100 wall passes — 50 each foot",pts:5},
    {id:"b2",label:"5 minutes juggling",pts:5},
    {id:"b3",label:"10 step-overs into a sprint",pts:5} ],
  [ {id:"b1",label:"Dribble a figure-8 through two markers, 10 laps",pts:5},
    {id:"b2",label:"6 sprints, 20 metres, walk back between",pts:5},
    {id:"b3",label:"50 wall passes, weak foot only",pts:5} ],
  [ {id:"b1",label:"5 minutes first touch off the wall",pts:5},
    {id:"b2",label:"Watch one clip, copy one move",pts:5} ],
  [ {id:"b1",label:"Arrive early, 20 touches before warm-up",pts:5} ],
  [ {id:"b1",label:"30 minutes at the park with a mate",pts:10},
    {id:"b2",label:"20 shots — 10 each foot",pts:5} ],
  [ {id:"b1",label:"Beat your juggling record — write the number down",pts:10},
    {id:"b2",label:"Pick the one move you'll work on this week",pts:5} ]
];

const HOME = [
  {id:"h1",label:"Make your bed",pts:5},
  {id:"h2",label:"Homework or 20 minutes reading",pts:5},
  {id:"h3",label:"Football bag packed for tomorrow",pts:5},
  {id:"h4",label:"Kit in the wash, boots cleaned",pts:5},
  {id:"h5",label:"Help clear the table",pts:5}
];

const RECOVER = [
  {id:"r1",label:"5 minutes stretching",pts:5},
  {id:"r2",label:"Veggies at dinner",pts:5},
  {id:"r3",label:"In bed by 8:30, no screen",pts:10}
];

const WATER_GLASSES = 6;   // 2 pts each
const WATER_PTS = 2;
const GOAL = 0.8;          // weekly goal = 80% of everything on offer

// Notifications — change the topic to something only you know, then
// subscribe to that exact topic in the ntfy app on your phone.
const NTFY_TOPIC = "vn-236bb9c0212ccc5c8c4b";
const NOTIFY = true;
/* --------------------------------------------------------------- */

const $ = s => document.querySelector(s);
const dayNames = ["M","T","W","T","F","S","S"];
let store = {};

function mondayOf(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
const today = new Date();
const monday = mondayOf(today);
const KEY = "vedran-week-" + monday.toISOString().slice(0,10);
let sel = (today.getDay() + 6) % 7;

function load(){
  try { store = JSON.parse(localStorage.getItem(KEY)) || {}; }
  catch(e){ store = {}; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){}
}
function dayState(i){ return store[i] || (store[i] = {done:{}, water:0}); }

function tasksFor(i){ return [...BALL[i], ...HOME, ...RECOVER]; }
function dayMax(i){ return tasksFor(i).reduce((s,t)=>s+t.pts,0) + WATER_GLASSES*WATER_PTS; }
function dayPts(i){
  const st = dayState(i);
  return tasksFor(i).reduce((s,t)=> s + (st.done[t.id] ? t.pts : 0), 0) + st.water*WATER_PTS;
}
function weekMax(){ let s=0; for(let i=0;i<7;i++) s+=dayMax(i); return s; }
function weekPts(){ let s=0; for(let i=0;i<7;i++) s+=dayPts(i); return s; }

function fmt(d){ return d.toLocaleDateString("en-AU",{day:"numeric",month:"short"}); }

function toggle(i,id){
  const st = dayState(i);
  st.done[id] = !st.done[id];
  save(); checkNotify(i); render();
}
function setWater(i,n){
  const st = dayState(i);
  st.water = (st.water === n) ? n-1 : n;
  save(); checkNotify(i); render();
}

/* --- notifications ------------------------------------------------ */
const DAY_FULL = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

function queueNote(title, message, tags){
  if(!NOTIFY) return;
  store.queue = store.queue || [];
  store.queue.push({topic:NTFY_TOPIC, title, message, tags});
  save(); flushQueue();
}

function flushQueue(){
  if(!NOTIFY || !store.queue || !store.queue.length) return;
  const note = store.queue[0];
  fetch("https://ntfy.sh/", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(note)
  }).then(r => {
    if(!r.ok) throw new Error(r.status);
    store.queue.shift();
    save();
    if(store.queue.length) flushQueue();   // keep draining
  }).catch(() => { /* stays queued, retried on next tap */ });
}

function checkNotify(i){
  store.sent = store.sent || {};
  if(dayPts(i) >= dayMax(i)*GOAL && !store.sent["d"+i]){
    store.sent["d"+i] = true;
    queueNote("Day done", "Vedran finished " + DAY_FULL[i] + " — " + dayPts(i) + " points.", ["soccer"]);
  }
  const target = Math.round(weekMax()*GOAL);
  if(weekPts() >= target && !store.sent.week){
    store.sent.week = true;
    queueNote("Weekly goal hit", "Vedran hit " + weekPts() + " of " + target + " points. Full time.", ["trophy"]);
  }
  save();
}

function taskRow(i,t){
  const on = !!dayState(i).done[t.id];
  return `<button class="task" aria-pressed="${on}" data-id="${t.id}">
    <span class="tick"><svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"/></svg></span>
    <span class="label">${t.label}</span>
    <span class="pts">${t.pts}</span>
  </button>`;
}

function group(title, i, list){
  const got = list.reduce((s,t)=> s + (dayState(i).done[t.id] ? t.pts : 0), 0);
  const max = list.reduce((s,t)=>s+t.pts,0);
  return `<h2>${title}<em>${got}/${max}</em></h2>` + list.map(t=>taskRow(i,t)).join("");
}

function render(){
  const pts = weekPts(), max = weekMax(), target = Math.round(max*GOAL);
  const sunday = new Date(monday); sunday.setDate(sunday.getDate()+6);

  $("#who").textContent = PLAYER;
  $("#dates").textContent = fmt(monday) + " – " + fmt(sunday);
  $("#pts").textContent = pts;
  $("#target").textContent = "/ " + target + " points";
  $("#weekly").textContent = pts >= target ? "Goal reached" : (target-pts) + " points to go";

  const blocks = 10, lit = Math.min(blocks, Math.floor(pts/target*blocks));
  $("#bar").innerHTML = Array.from({length:blocks},(_,n)=>
    `<i class="${n<lit ? (pts>=target?"full":"on") : ""}"></i>`).join("");
  $("#fulltime").hidden = pts < target;

  $("#days").innerHTML = PLAN.map((p,i)=>{
    const complete = dayPts(i) >= dayMax(i)*GOAL;
    const cls = complete ? "done" : (p.train ? "train" : "");
    return `<button class="day" aria-pressed="${i===sel}" data-day="${i}">
      ${dayNames[i]}<span class="dot ${cls}"></span></button>`;
  }).join("");

  $("#plan").innerHTML = PLAN[sel].note;

  const st = dayState(sel);
  $("#lists").innerHTML =
    group("Ball work", sel, BALL[sel]) +
    group("Home &amp; school", sel, HOME) +
    group("Recovery", sel, RECOVER) +
    `<div class="water"><span class="label">Water — ${WATER_GLASSES} glasses</span>
      <span class="glasses">` +
      Array.from({length:WATER_GLASSES},(_,n)=>
        `<button class="glass ${n < st.water ? "on":""}" data-water="${n+1}"
           aria-label="Glass ${n+1}"></button>`).join("") +
    `</span></div>`;
}

document.addEventListener("click", e => {
  const day = e.target.closest("[data-day]");
  if(day){ sel = +day.dataset.day; render(); return; }
  const task = e.target.closest(".task");
  if(task){ toggle(sel, task.dataset.id); return; }
  const glass = e.target.closest("[data-water]");
  if(glass){ setWater(sel, +glass.dataset.water); return; }
});

$("#reset").addEventListener("click", () => {
  store[sel] = {done:{}, water:0};
  if(store.sent) delete store.sent["d"+sel];
  save(); render();
});

load();
flushQueue();
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Vladan Neziri">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Day">
<meta name="theme-color" content="#0A2C1D">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230A2C1D'/><circle cx='32' cy='32' r='15' fill='%23F2C300'/></svg>">
<title>My Day</title>
<style>
  :root{
    --pitch:#0A2C1D; --raised:#10391F; --chalk:#E8F3EC; --dim:#8FAE9C;
    --line:rgba(232,243,236,.16); --amber:#F2C300; --lime:#9BE564; --red:#FF8A6B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--pitch);color:var(--chalk)}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.35;
    padding:env(safe-area-inset-top) 0 calc(30px + env(safe-area-inset-bottom));
    background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.014) 0 56px,transparent 56px 112px);
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 18px}

  .parentbar{background:var(--amber);color:#152A16;font-weight:700;font-size:14px;
    padding:calc(9px + env(safe-area-inset-top)) 18px 9px;display:flex;justify-content:space-between;align-items:center}
  .parentbar button{background:#152A16;color:var(--amber);border:0;font:inherit;font-weight:700;
    padding:6px 12px;border-radius:4px;cursor:pointer}

  .board{margin-top:18px;border:1.5px solid var(--line);border-radius:6px;background:var(--raised);padding:16px}
  .board-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .who{font-size:14px;letter-spacing:.14em;color:var(--dim)}
  .date{font-size:13px;color:var(--dim)}
  .score{display:flex;align-items:baseline;gap:9px;margin:10px 0 4px}
  .score b{font-size:56px;line-height:.9;font-weight:800;color:var(--amber);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .score span{font-size:16px;color:var(--dim)}
  .bank{font-size:15px}.bank b{color:var(--lime);font-variant-numeric:tabular-nums}
  .waiting{margin-top:7px;font-size:14px;color:var(--amber)}

  .next{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
  .next-row{display:flex;justify-content:space-between;font-size:14px;color:var(--dim);margin-bottom:7px}
  .next-row b{color:var(--chalk);font-weight:600}
  .bar{display:flex;gap:4px;height:13px}
  .bar i{flex:1;background:rgba(232,243,236,.09);border-radius:2px}
  .bar i.on{background:var(--amber)}

  h2{margin:28px 0 2px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
  h2 em{font-style:normal;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}

  .task{width:100%;display:flex;align-items:center;gap:13px;padding:14px 2px;background:none;border:0;
    border-bottom:1px solid var(--line);color:var(--chalk);font:inherit;text-align:left;cursor:pointer}
  .tick{flex:none;width:26px;height:26px;border:2px solid var(--dim);border-radius:50%;display:grid;place-items:center;transition:transform .08s ease-out}
  .tick svg{width:15px;height:15px;stroke:var(--pitch);stroke-width:3.2;fill:none;opacity:0}
  .task:active .tick{transform:scale(.86)}
  .task.pending .tick{border-color:var(--amber);border-style:dashed}
  .task.done .tick{background:var(--lime);border-color:var(--lime)}
  .task.done .tick svg{opacity:1}
  .task.done .label{color:var(--dim);text-decoration:line-through}
  .label{flex:1}
  .label small{display:block;font-size:12px;color:var(--amber);text-decoration:none}
  .pts{flex:none;color:var(--dim);font-size:14px;font-variant-numeric:tabular-nums}
  .judge{display:flex;gap:7px;padding:0 2px 13px;border-bottom:1px solid var(--line)}
  .judge button{flex:1;border:1.5px solid var(--line);background:none;color:var(--chalk);font:inherit;
    font-size:14px;font-weight:600;padding:9px;border-radius:4px;cursor:pointer}
  .judge .ok{border-color:var(--lime);color:var(--lime)}
  .judge .no{border-color:var(--red);color:var(--red)}

  .water{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}
  .glasses{display:flex;gap:6px;margin-left:auto}
  .glass{width:20px;height:28px;border:2px solid var(--dim);border-radius:3px 3px 7px 7px;background:none;cursor:pointer;padding:0}
  .glass.on{background:var(--amber);border-color:var(--amber)}

  .reward{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
  .reward .cost{flex:none;width:50px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--amber)}
  .reward .name{flex:1}
  .reward.locked{opacity:.45}
  .reward.locked .cost{color:var(--dim)}
  .get{flex:none;border:1.5px solid var(--lime);background:none;color:var(--lime);font:inherit;
    font-size:14px;font-weight:700;padding:7px 12px;border-radius:4px;cursor:pointer}
  .reward.locked .get{display:none}
  .askedfor{flex:none;font-size:13px;color:var(--amber);font-weight:600}

  .penalty{display:flex;gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
  .penalty .cost{flex:none;width:50px;color:var(--red);font-weight:700;font-variant-numeric:tabular-nums}
  .penalty .name{flex:1}
  .penalty button{border:1.5px solid var(--red);background:none;color:var(--red);font:inherit;
    font-size:14px;font-weight:700;padding:7px 12px;border-radius:4px;cursor:pointer}
  .log{padding:11px 2px;border-bottom:1px solid var(--line);font-size:15px;color:var(--dim)}
  .log b{color:var(--red);font-variant-numeric:tabular-nums}

  .modal{position:fixed;inset:0;background:rgba(6,20,13,.82);display:grid;place-items:center;padding:22px;z-index:20}
  .sheet{width:100%;max-width:340px;background:var(--raised);border:1.5px solid var(--line);border-radius:8px;padding:20px}
  .sheet h3{margin:0 0 14px;font-size:17px;font-weight:700;line-height:1.3}
  .sheet input{width:100%;padding:13px;font:inherit;font-size:19px;background:var(--pitch);color:var(--chalk);
    border:1.5px solid var(--line);border-radius:5px;margin-bottom:14px}
  .mBtns{display:flex;gap:9px}
  .mBtns button{flex:1;padding:12px;font:inherit;font-weight:700;border-radius:5px;cursor:pointer;background:none;border:1.5px solid}
  .mYes{border-color:var(--lime);color:var(--lime)}
  .mNo{border-color:var(--line);color:var(--dim)}

  .record{display:flex;align-items:baseline;gap:9px;padding:14px 2px;border-bottom:1px solid var(--line)}
  .record b{font-size:34px;font-weight:800;color:var(--lime);font-variant-numeric:tabular-nums;line-height:1}
  .record span{flex:1;color:var(--dim);font-size:14px}
  .bonus{margin-top:5px;font-size:14px;color:var(--dim)}
  .bonus b{color:var(--lime)}
  .task.capped{opacity:.45}
  .task.capped .pts{text-decoration:line-through}

  .history{display:flex;gap:6px;align-items:flex-end;height:54px;margin-top:10px}
  .history div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
  .history span{width:100%;background:var(--amber);border-radius:2px;min-height:2px}
  footer{margin-top:30px;color:var(--dim);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:14px}
  .plain{background:none;border:0;color:var(--dim);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px 0}
  :focus-visible{outline:2px solid var(--amber);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="modal" id="modal" hidden>
  <div class="sheet">
    <h3 id="mTitle"></h3>
    <input id="mInput" hidden>
    <div class="mBtns">
      <button class="mNo" id="mCancel">Cancel</button>
      <button class="mYes" id="mOk">OK</button>
    </div>
  </div>
</div>
<div class="parentbar" id="parentbar" hidden>
  <span>Parent mode</span><button id="exitParent">Done</button>
</div>
<div class="wrap">

  <section class="board">
    <div class="board-top"><div class="who" id="who"></div><div class="date" id="date"></div></div>
    <div class="score"><b id="today">0</b><span>points today</span></div>
    <div class="bank">Saved up: <b id="bank">0</b></div>
    <div class="bonus" id="bonus"></div>
    <div class="waiting" id="waiting"></div>
    <div class="next">
      <div class="next-row"><span id="nextName"></span><b id="nextGap"></b></div>
      <div class="bar" id="bar"></div>
    </div>
  </section>

  <div id="lists"></div>

  <h2>Juggling record<em id="recordWhen"></em></h2>
  <div class="record">
    <b id="recordBest">0</b><span>keepy-uppies</span>
    <button class="get" id="recordBtn">Beat it</button>
  </div>

  <h2>Rewards<em id="bankMini"></em></h2>
  <div id="rewards"></div>

  <div id="parentZone"></div>

  <h2>Last 7 days</h2>
  <div class="history" id="history"></div>

  <footer>
    <span id="tip"></span>
    <span>
      <button class="plain" id="parentBtn">Parent</button>
      <button class="plain" id="reset" hidden>Clear today</button>
    </span>
  </footer>
</div>

<script>
/* ---------------------------------------------------------------
   CONFIG
   --------------------------------------------------------------- */
const PLAYER = "VEDRAN";
const PARENT_PIN = "20170612";

const GROUPS = [
  { title:"Morning", tasks:[
    {id:"m4",label:"Up before 7",pts:5},
    {id:"m1",label:"Make your bed",pts:3},
    {id:"m2",label:"Brush teeth",pts:2},
    {id:"m3",label:"Dressed and ready without being asked",pts:3},
  ]},
  { title:"Home", tasks:[
    {id:"h1",label:"Put your dishes away",pts:1,repeat:true},
    {id:"h2",label:"Pick up your stuff — room and lounge",pts:1,repeat:true},
    {id:"h3",label:"Help clear the table",pts:1,repeat:true},
    {id:"h4",label:"Help with your brother, no being asked twice",pts:1,repeat:true},
    {id:"h6",label:"Something helpful nobody asked you to do",pts:1,repeat:true},
    {id:"h7",label:"Vacuum a room properly",pts:5,repeat:true},
  ]},
  { title:"Football", tasks:[
    {id:"f1",label:"Club session — turned up and worked",pts:12},
    {id:"f2",label:"15 minutes ball work at home",pts:8,repeat:true},
    {id:"f3",label:"15 minutes juggling",pts:5,repeat:true},
    {id:"f4",label:"Sprints or fitness",pts:15,repeat:true},
    {id:"f5",label:"Watch a clip and copy the move",pts:3,repeat:true},
    {id:"f6",label:"30 minutes training or running in the rain",pts:10,repeat:true},
    {id:"f8",label:"A full hour running with the ball",pts:20,repeat:true},
  ]},
  { title:"Indoor exercises", tasks:[
    {id:"x1",label:"20 sit-ups",pts:5,repeat:true},
    {id:"x2",label:"10 push-ups",pts:5,repeat:true},
    {id:"x3",label:"20 squats",pts:5,repeat:true},
    {id:"x4",label:"30 second plank",pts:5,repeat:true},
    {id:"x5",label:"20 step-ups on the stairs",pts:5,repeat:true},
  ]},
  { title:"Books and writing", tasks:[
    {id:"b1",label:"30 minutes reading",pts:10,repeat:true},
    {id:"b2",label:"30 minutes writing",pts:10,repeat:true},
  ]},
  { title:"Food", tasks:[
    {id:"e1",label:"Proper breakfast",pts:3},
    {id:"e3",label:"Veggies at dinner",pts:4},
    {id:"e4",label:"Water instead of soft drink all day",pts:4},
  ]},
  { title:"Night", tasks:[
    {id:"n1",label:"5 minutes stretching",pts:4},
    {id:"n3",label:"Brush teeth",pts:2},
    {id:"n4",label:"In bed by 8:30, no screen",pts:6},
  ]},
];

const WATER_GLASSES = 6;            // 1 point each, no approval needed

// Each tier costs the same; he picks one option from it.
const REWARDS = [
  {cost:20,  options:["30 minutes extra on the tablet, phone or TV",
                      "Stay up 30 minutes later — not before training",
                      "Pick the music in the car",
                      "20 minutes in the park with Dad, just kicking"]},
  {cost:40,  options:["A drink of your choice",
                      "A small treat — ice cream or chocolate",
                      "Takeaway dinner, your pick",
                      "A mate over",
                      "An hour extra on the tablet, phone or TV",
                      "Cards or a magazine"]},
  {cost:60,  options:["Movie night at home, you choose, with snacks",
                      "Something small for football — socks, grips, a drink bottle"]},
  {cost:100, options:["Movies out",
                      "Trampoline park or indoor soccer",
                      "$20 to spend on whatever you want"]},
  {cost:150, options:["Mates over, pizza night",
                      "A day out, your choice",
                      "A new ball"]},
  {cost:300, options:["New boots",
                      "A jersey",
                      "A big day out"]},
];

const PENALTIES = [
  {cost:10, name:"Phone or tablet without asking"},
  {cost:10, name:"Games before your jobs are done"},
  {cost:15, name:"Screens after lights out"},
  {cost:5,  name:"TV without asking"},
  {cost:5,  name:"Didn't listen — asked three times"},
  {cost:5,  name:"Backchat"},
  {cost:8,  name:"Rough with your brother"},
  {cost:5,  name:"Argued about going to training"},
  {cost:3,  name:"Left your stuff everywhere"},
  {cost:3,  name:"Skipped teeth or dragged out bedtime"},
];

const DAILY_TARGET = 20;
const MORNING_BEFORE = 9;     // football done before 9am pays more
const MORNING_MULT = 1.5;
const FITNESS_ID = "f4";      // sprints/fitness
const FITNESS_CAP = 3;        // max times per week it pays
const GOOD_DAYS_FOR_BONUS = 5;
const WEEK_BONUS = 20;
const NTFY_TOPIC = "vn-236bb9c0212ccc5c8c4b";
const NOTIFY = true;
/* --------------------------------------------------------------- */

const $ = s => document.querySelector(s);
const KEY = "vedran-daily-v2";
let store = {days:{}, spent:[], claim:null, penalties:[], armed:true, queue:[]};
let parent = false;

const dkey = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayKey = () => dkey(new Date());
const ALL = GROUPS.flatMap(g => g.tasks);
const byId = id => ALL.find(t => t.id === id);

function load(){
  try{ const raw = JSON.parse(localStorage.getItem(KEY)); if(raw) store = Object.assign(store, raw); }catch(e){}
  store.days = store.days || {}; store.spent = store.spent || [];
  store.penalties = store.penalties || []; store.queue = store.queue || [];
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
function day(k){ return store.days[k] || (store.days[k] = {state:{}, water:0, am:{}}); }

const FOOTBALL_IDS = (GROUPS.find(g=>g.title==="Football")||{tasks:[]}).tasks.map(t=>t.id);
function valueOf(k, id){
  const t = byId(id); if(!t) return 0;
  const d = day(k);
  return (d.am && d.am[id]) ? Math.round(t.pts * MORNING_MULT) : t.pts;
}

function ptsOf(k){
  const d = day(k);
  const got = Object.keys(d.state).reduce((s,id)=> s + (d.state[id]==="ok" ? valueOf(k,id) : 0), 0);
  const lost = store.penalties.filter(x=>x.on===k).reduce((s,x)=>s+x.cost,0);
  return got + d.water - lost;
}
function pendingToday(){
  const d = day(todayKey());
  return Object.keys(d.state).filter(id => d.state[id]==="wait");
}
function earned(){ return Object.keys(store.days).reduce((s,k)=> s+ptsOf(k), 0); }

function mondayKey(k){
  const [y,m,dd] = k.split("-").map(Number);
  const d = new Date(y, m-1, dd);
  d.setDate(d.getDate() - ((d.getDay()+6)%7));
  return dkey(d);
}
function goodDaysIn(wk){
  return Object.keys(store.days).filter(k => mondayKey(k)===wk && ptsOf(k) >= DAILY_TARGET).length;
}
function bonusTotal(){
  const weeks = [...new Set(Object.keys(store.days).map(mondayKey))];
  return weeks.reduce((s,w)=> s + (goodDaysIn(w) >= GOOD_DAYS_FOR_BONUS ? WEEK_BONUS : 0), 0);
}
function fitnessThisWeek(){
  const wk = mondayKey(todayKey());
  return Object.keys(store.days).filter(k =>
    mondayKey(k)===wk && store.days[k].state && store.days[k].state[FITNESS_ID]).length;
}
function fitnessLocked(){
  const st = day(todayKey()).state[FITNESS_ID];
  return !st && fitnessThisWeek() >= FITNESS_CAP;
}

function bank(){ return earned() + bonusTotal() - store.spent.reduce((s,r)=>s+r.cost,0); }

/* --- notify -------------------------------------------------------- */
function note(title, message, tags){
  if(!NOTIFY) return;
  store.queue.push({topic:NTFY_TOPIC, title, message, tags});
  save(); flush();
}
function flush(){
  if(!NOTIFY || !store.queue.length) return;
  fetch("https://ntfy.sh/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(store.queue[0])})
    .then(r=>{ if(!r.ok) throw 0; store.queue.shift(); save(); if(store.queue.length) flush(); })
    .catch(()=>{});
}
function armNotify(){
  const n = pendingToday().length;
  if(n && store.armed){
    store.armed = false;
    note("Waiting on you", "Vedran has " + n + " thing" + (n>1?"s":"") + " to check off.", ["soccer"]);
  }
  if(!n) store.armed = true;
  save();
}

/* --- actions ------------------------------------------------------- */
function tapTask(id){
  const k = todayKey(), d = day(k), st = d.state[id];
  d.am = d.am || {};
  if(id === FITNESS_ID && !parent && fitnessLocked()) return;
  if(parent){ if(st==="ok"){ delete d.state[id]; delete d.am[id]; } else d.state[id] = "ok"; }
  else if(st==="ok") return;                    // only a parent can undo an approval
  else if(st==="wait"){ delete d.state[id]; delete d.am[id]; }
  else {
    d.state[id] = "wait";
    if(FOOTBALL_IDS.includes(id) && new Date().getHours() < MORNING_BEFORE) d.am[id] = true;
  }
  save(); armNotify(); render();
}
function newRecord(){
  ask("How many keepy-uppies?", "number").then(v => {
    const n = parseInt(v, 10);
    if(!n || n < 1) return;
    const best = (store.record && store.record.best) || 0;
    if(n <= best){ ask("Best is still " + best + ". Go again.").then(()=>{}); return; }
    store.record = {best:n, on:todayKey()};
    save();
    note("New juggling record", "Vedran just hit " + n + " keepy-uppies. Old record was " + best + ".", ["soccer"]);
    render();
  });
}
function judge(id, ok){
  const d = day(todayKey());
  if(ok) d.state[id] = "ok"; else delete d.state[id];
  save(); armNotify(); render();
}
function approveAll(){
  const d = day(todayKey());
  pendingToday().forEach(id => d.state[id] = "ok");
  save(); armNotify(); render();
}
function setWater(n){
  const d = day(todayKey());
  d.water = (d.water===n) ? n-1 : n;
  save(); render();
}
function askReward(cost, name){
  store.claim = {cost:cost, name:name}; save();
  note("Reward request", "Vedran wants: " + name + " (" + cost + " points). He has " + bank() + ".", ["tada"]);
  render();
}
function settleClaim(ok){
  const c = store.claim;
  if(ok && c && bank() >= c.cost) store.spent.push({cost:c.cost, name:c.name, on:todayKey()});
  store.claim = null; save(); render();
}
/* --- in-page dialogs (iOS home-screen apps block prompt/confirm) ---- */
function ask(title, kind){          // kind: "pin" | "number" | "text" | undefined (yes/no)
  return new Promise(resolve => {
    const m = $("#modal"), inp = $("#mInput");
    $("#mTitle").textContent = title;
    inp.hidden = !kind;
    if(kind){
      inp.value = "";
      inp.type = (kind==="text") ? "text" : "tel";
      inp.inputMode = (kind==="text") ? "text" : "numeric";
    }
    m.hidden = false;
    if(kind) setTimeout(()=>inp.focus(), 50);
    const done = v => { m.hidden = true; $("#mOk").onclick = null; $("#mCancel").onclick = null; inp.onkeydown = null; resolve(v); };
    $("#mOk").onclick = () => done(kind ? inp.value.trim() : true);
    $("#mCancel").onclick = () => done(null);
    inp.onkeydown = e => { if(e.key === "Enter") done(inp.value.trim()); };
  });
}

function penalise(p){
  ask("Take " + p.cost + " points off for: " + p.name + "?").then(ok => {
    if(!ok) return;
    store.penalties.push({cost:p.cost, name:p.name, on:todayKey()});
    save(); render();
  });
}
function penaliseCustom(){
  ask("What for?", "text").then(why => {
    if(!why) return;
    ask("How many points?", "number").then(v => {
      const n = parseInt(v, 10);
      if(!n || n < 1) return;
      store.penalties.push({cost:n, name:why, on:todayKey()});
      save(); render();
    });
  });
}
function undoPenalty(i){ store.penalties.splice(i,1); save(); render(); }

/* --- render -------------------------------------------------------- */
function render(){
  const k = todayKey(), d = day(k), pts = ptsOf(k), b = bank(), waits = pendingToday();

  $("#parentbar").hidden = !parent;
  $("#reset").hidden = !parent;
  $("#parentBtn").hidden = parent;
  $("#who").textContent = PLAYER;
  $("#date").textContent = new Date().toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"short"});
  $("#today").textContent = pts;
  $("#bank").textContent = b;
  $("#bankMini").textContent = b + " saved";
  $("#waiting").textContent = waits.length ? waits.length + " waiting for Dad to check" : "";

  const wk = mondayKey(k), good = goodDaysIn(wk);
  $("#bonus").innerHTML = good >= GOOD_DAYS_FOR_BONUS
    ? `Weekly bonus <b>+${WEEK_BONUS}</b> — ${good} good days`
    : `${good}/${GOOD_DAYS_FOR_BONUS} good days this week — ${WEEK_BONUS} point bonus at ${GOOD_DAYS_FOR_BONUS}`;

  $("#recordBest").textContent = (store.record && store.record.best) || 0;
  $("#recordWhen").textContent = store.record ? "set " + store.record.on : "";

  const next = REWARDS.find(r => r.cost > b) || REWARDS[REWARDS.length-1];
  const prev = [...REWARDS].reverse().find(r => r.cost <= b);
  const floor = prev && prev.cost < next.cost ? prev.cost : 0;
  const frac = next.cost > floor ? (b-floor)/(next.cost-floor) : 1;
  $("#nextName").textContent = b >= next.cost ? "Everything unlocked" : "Next: the " + next.cost + " point rewards";
  $("#nextGap").textContent = b >= next.cost ? "" : (next.cost-b) + " to go";
  const blocks = 12, lit = Math.max(0, Math.min(blocks, Math.round(frac*blocks)));
  $("#bar").innerHTML = Array.from({length:blocks},(_,n)=>`<i class="${n<lit?"on":""}"></i>`).join("");

  $("#lists").innerHTML = GROUPS.map(g => {
    const got = g.tasks.reduce((s,t)=> s + (d.state[t.id]==="ok" ? valueOf(k,t.id) : 0), 0);
    const max = g.tasks.reduce((s,t)=> s+t.pts, 0);
    const rows = g.tasks.map(t => {
      const st = d.state[t.id];
      const am = d.am && d.am[t.id];
      const capped = t.id===FITNESS_ID && !st && fitnessThisWeek() >= FITNESS_CAP;
      const cls = (st==="ok" ? "done" : st==="wait" ? "pending" : "") + (capped ? " capped" : "");
      const sub = st==="wait" ? "<small>waiting for Dad" + (am ? " · morning ×" + MORNING_MULT : "") + "</small>"
                : am ? "<small>morning ×" + MORNING_MULT + "</small>"
                : capped ? "<small>" + FITNESS_CAP + " this week already — rest those legs</small>" : "";
      const shown = am ? Math.round(t.pts*MORNING_MULT) : t.pts;
      const row = `<button class="task ${cls}" data-id="${t.id}">
          <span class="tick"><svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"/></svg></span>
          <span class="label">${t.label}${sub}</span><span class="pts">${shown}</span></button>`;
      const verdict = (parent && st==="wait")
        ? `<div class="judge"><button class="ok" data-yes="${t.id}">Yes, done</button>
           <button class="no" data-no="${t.id}">Not done</button></div>` : "";
      return row + verdict;
    }).join("");
    const water = g.title==="Food"
      ? `<div class="water"><span class="label">Water — ${WATER_GLASSES} glasses</span><span class="glasses">` +
        Array.from({length:WATER_GLASSES},(_,n)=>
          `<button class="glass ${n<d.water?"on":""}" data-water="${n+1}" aria-label="Glass ${n+1}"></button>`).join("") +
        `</span></div>` : "";
    return `<h2>${g.title}<em>${got}/${max}</em></h2>${rows}${water}`;
  }).join("");

  $("#rewards").innerHTML = REWARDS.map(tier => {
    const can = b >= tier.cost;
    return tier.options.map((opt,i) => {
      const asked = store.claim && store.claim.name === opt && store.claim.cost === tier.cost;
      const btn = asked
        ? (parent ? `<button class="get" data-settle="yes">Give it</button>` : `<span class="askedfor">asked Dad</span>`)
        : (can ? `<button class="get" data-ask="${tier.cost}" data-opt="${i}">Ask</button>` : "");
      return `<div class="reward ${can?"":"locked"}">
        <span class="cost">${i===0 ? tier.cost : ""}</span>
        <span class="name">${opt}</span>${btn}</div>`;
    }).join("");
  }).join("");

  const todayPen = store.penalties.map((p,i)=>({p,i})).filter(x=>x.p.on===k);
  $("#parentZone").innerHTML = !parent
    ? `<h2>What loses points</h2>`
      + PENALTIES.map(p=>`<div class="penalty"><span class="cost">−${p.cost}</span>
          <span class="name">${p.name}</span></div>`).join("")
      + (todayPen.length
        ? `<h2>Lost today</h2>` + todayPen.map(x=>`<div class="log">${x.p.name} <b>−${x.p.cost}</b></div>`).join("")
        : "")
    : (waits.length ? `<h2>Waiting<em>${waits.length}</em></h2>
        <div class="judge"><button class="ok" data-approveall="1">Approve all ${waits.length}</button></div>` : "")
      + `<h2>Take points off</h2>`
      + PENALTIES.map((p,i)=>`<div class="penalty"><span class="cost">−${p.cost}</span>
          <span class="name">${p.name}</span><button data-pen="${i}">Apply</button></div>`).join("")
      + `<div class="penalty"><span class="cost">−?</span>
          <span class="name">Something else</span><button data-custom="1">Apply</button></div>`
      + (todayPen.length ? `<h2>Taken off today</h2>` + todayPen.map(x=>
          `<div class="penalty"><span class="cost">−${x.p.cost}</span><span class="name">${x.p.name}</span>
           <button data-undo="${x.i}">Undo</button></div>`).join("") : "")
      + (store.claim ? `<h2>Reward asked for</h2><div class="penalty">
          <span class="cost">−${store.claim.cost}</span>
          <span class="name">${store.claim.name}</span>
          <button data-settle="no">Not yet</button></div>` : "");

  const days = [];
  for(let i=6;i>=0;i--){
    const dt = new Date(); dt.setDate(dt.getDate()-i);
    days.push({label:["S","M","T","W","T","F","S"][dt.getDay()],
               pts: Math.max(0, store.days[dkey(dt)] ? ptsOf(dkey(dt)) : 0)});
  }
  const top = Math.max(DAILY_TARGET, ...days.map(x=>x.pts));
  $("#history").innerHTML = days.map(x=>
    `<div><span style="height:${Math.round(x.pts/top*38)}px"></span>${x.label}</div>`).join("");

  $("#tip").textContent = pts >= DAILY_TARGET ? "Good day." : Math.max(0, DAILY_TARGET-pts) + " points to a good day";
}

document.addEventListener("click", e => {
  const yes = e.target.closest("[data-yes]");        if(yes) return judge(yes.dataset.yes, true);
  const no  = e.target.closest("[data-no]");         if(no)  return judge(no.dataset.no, false);
  const all = e.target.closest("[data-approveall]"); if(all) return approveAll();
  const pen = e.target.closest("[data-pen]");        if(pen) return penalise(PENALTIES[+pen.dataset.pen]);
  const cus = e.target.closest("[data-custom]");     if(cus) return penaliseCustom();
  const un  = e.target.closest("[data-undo]");       if(un)  return undoPenalty(+un.dataset.undo);
  const ask = e.target.closest("[data-ask]");
  if(ask){
    const tier = REWARDS.find(t => t.cost === +ask.dataset.ask);
    return askReward(tier.cost, tier.options[+ask.dataset.opt]);
  }
  const set = e.target.closest("[data-settle]");     if(set) return settleClaim(set.dataset.settle==="yes");
  const g   = e.target.closest("[data-water]");      if(g)   return setWater(+g.dataset.water);
  const t   = e.target.closest(".task");             if(t)   return tapTask(t.dataset.id);
});
$("#recordBtn").addEventListener("click", newRecord);
$("#parentBtn").addEventListener("click", () => {
  ask("PIN", "pin").then(v => {
    if(v === PARENT_PIN){ parent = true; render(); }
    else if(v !== null) ask("Wrong PIN.").then(()=>{});
  });
});
$("#exitParent").addEventListener("click", () => { parent = false; render(); });
$("#reset").addEventListener("click", () => {
  store.days[todayKey()] = {state:{}, water:0, am:{}};
  store.penalties = store.penalties.filter(p => p.on !== todayKey());
  store.armed = true; save(); render();
});

load(); flush(); render();
</script>
</body>
</html>
